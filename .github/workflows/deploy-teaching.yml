name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/memoni-learning-app-NQ5zz]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build teaching app
        run: npm run build
        working-directory: apps/teaching
        env:
          VITE_BASE: /ghar-ji-gaal/

      - name: Build collector app (demo mode)
        run: npm run build
        working-directory: apps/collector
        env:
          VITE_BASE: /ghar-ji-gaal/collector/
          VITE_DEMO_MODE: "true"

      - name: Combine build outputs
        run: |
          mkdir -p deploy
          cp -r apps/teaching/dist/. deploy/
          mkdir -p deploy/collector
          cp -r apps/collector/dist/. deploy/collector/

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

      - uses: actions/deploy-pages@v4
        id: deploy
