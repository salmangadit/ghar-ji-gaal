name: Deploy Teaching App to GitHub Pages

on:
  push:
    branches: [main, claude/memoni-learning-app-NQ5zz]
    paths:
      - 'apps/teaching/**'
      - 'packages/shared/**'
      - '.github/workflows/deploy-teaching.yml'
  workflow_dispatch: # allow manual trigger from GitHub UI

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build teaching app
        run: npm run build
        working-directory: apps/teaching
        env:
          VITE_BASE: /ghar-ji-gaal/

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/teaching/dist

      - uses: actions/deploy-pages@v4
        id: deploy
